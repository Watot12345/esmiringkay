services:
  - type: web
    name: emiringkay-web
    env: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: Emiringkay
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "true"
      - key: LOG_CHANNEL
        value: stderr
      - key: APP_KEY
        value: "base64:lIaIQLTRzpkDFv/Rv7a2UY7yKMjReXWj2KaOSd4aeao="
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        sync: false
      - key: BROADCAST_CONNECTION
        value: reverb
      - key: QUEUE_CONNECTION
        value: database
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: REVERB_APP_ID
        value: "759439"
      - key: REVERB_APP_KEY
        value: "qsgvmwadpmdqqovwougw"
      - key: REVERB_APP_SECRET
        value: "uhusoopdvye1o9opnju8"
      - key: REVERB_SERVER_HOST
        value: "0.0.0.0"
      - key: REVERB_SERVER_PORT
        value: "8080"
      - key: REVERB_HOST
        value: "0.0.0.0"
      - key: REVERB_PORT
        value: "8080"
      - key: REVERB_SCHEME
        value: "http"
